{% extends 'global/base.html' %}

{% block content %}
  <div class="single-contact">

    <p><b>ID:</b> {{ category.id }}</p>
    <p><b>Name:</b> {{ category.name }}</p>

    <div class="contact-links">
      <a class="btn btn-link" href="{% url 'update' category.id %}">Update</a>

      <form action="{% url 'delete' category.id %}" method="POST">
        {% csrf_token %}

        {% if confirmation == 'no' %}
          <input type="hidden" name="confirmation" value="yes">
          <button class="btn btn-link btn-delete" type="submit">Confirma?</button>
        {% else %}
          <button class="btn btn-link btn-delete" type="submit">Delete</button>
        {% endif %}
      </form>
    </div>
  </div>
{% endblock content %}
